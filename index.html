<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geglo Browser</title><style>*{box-sizing:border-box;margin:0;padding:0}html,body{width:100vw;height:100vh;overflow:hidden;background:#121212;color:#e5e5e5;font-family:system-ui,sans-serif}#bg{position:fixed;inset:0;z-index:0;pointer-events:none}#fl{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:16vw;font-weight:900;color:#fff;text-shadow:0 0 30px #000;z-index:1;pointer-events:none;opacity:0}.shk{animation:k .25s infinite}@keyframes k{25%{transform:translate(-8px,6px)}50%{transform:translate(8px,-6px)}75%{transform:translate(-6px,-8px)}}.glt{animation:g .45s steps(2,end)}@keyframes g{20%{background:#003b00;transform:translateX(-6px)}40%{background:#00ff41;transform:translateX(6px)}60%{background:#001a00;transform:translateY(-4px)}80%{background:#008f11;transform:translateY(4px)}}#app{position:relative;z-index:2;display:flex;flex-direction:column;height:100vh}header,footer{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:rgba(18,18,18,.6);backdrop-filter:blur(6px)}header{border-bottom:1px solid rgba(255,255,255,.08)}.br,.ct{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}button{cursor:pointer;border:none;outline:none;color:inherit}#dm{display:none;background:rgba(40,40,40,.85);border:1px solid rgba(255,255,255,.25);padding:5px 14px;border-radius:16px;font-size:13px}.ib{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.1);font-size:15px;display:flex;align-items:center;justify-content:center}#hm.on{background:#facc15;color:#111;box-shadow:0 0 12px #facc15}#ho.on{background:#3b82f6;color:#fff}#home{display:none;flex:1;overflow:hidden}#home.show{display:flex}#tside{width:210px;background:rgba(15,15,18,.94);border-right:1px solid rgba(255,255,255,.09);display:flex;flex-direction:column;padding:10px 8px;gap:6px;flex-shrink:0}.tbt adius:12px;font-size:13px;font-weight:600}#tabbox{display:none;flex:1;flex-direction:column;min-height:62vh;background:#0b0b0e;border:1px solid rgba(255,255,255,.16);border-radius:14px;overflow:hidden}#tabbar{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:#1c1c21;border-bottom:1px solid rgba(255,255,255,.1);font-size:12px;gap:8px}#taburl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#93c5fd}#tabframe{flex:1;width:100%;border:0;background:#121216}.card{background:rgba(30,30,34,.85);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px}.card h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#9ca3af;margin-bottom:6px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:5px 11px;border-radius:12px;font-size:12px}.news a{display:block;color:#93c5fd;text-decoration:none;font-size:13px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06)}#ch{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}.m{max-width:75%;padding:10px 15px;border-radius:18px;font-size:14px;line-height:1.45;user-select:text;white-space:pre-wrap;word-break:break-word}.b{align-self:flex-start;background:rgba(36,36,36,.82);border:1px solid rgba(255,255,255,.1);color:#f3f4f6}.u{align-self:flex-end;background:#2563eb;color:#fff}#bar{display:flex;width:100%;align-items:center;background:rgba(34,34,34,.85);border:1px solid rgba(255,255,255,.14);border-radius:26px;padding:6px 8px 6px 18px}#in{flex:1;background:0;border:0;outline:0;color:#fff;font-size:14px}#sn{width:32px;height:32px;border-radius:50%;background:#fff;color:#111;font-weight:700}body.doe{color:#00ff41;font-family:monospace}body.doe header,body.doe footer{background:rgba(0,10,0,.7);border-color:#00ff41}body.doe .b,body.doe .u,body.doe #bar,body.doe #dm,body.doe .card,body.doe #tside{background:rgba(0,20,0,.88);border:1px solid #00ff41;color:#00ff41}body.doe #in{color:#00ff41}body.doe #sn{background:#00ff41;color:#000}body.yoda .b{border-color:#84cc16;background:rgba(20,38,14,.85);color:#ecfccb}.tab[draggable="true"]{cursor:grab}.tab.dragging{opacity:.45}.grp.dragover{outline:2px dashed var(--gc);background:rgba(255,255,255,.08)}#tlist.dragover-root{outline:2px dashed #3b82f6;border-radius:8px}.gname-in{flex:1;background:rgba(0,0,0,.65);border:1px solid #3b82f6;border-radius:4px;color:#fff;font-size:11px;padding:1px 5px;outline:0;min-width:0}#ntpage{display:none;flex:1;flex-direction:column;align-items:center;justify-content:space-between;padding:24px 28px;border-radius:16px;background:radial-gradient(circle at 18% 22%,rgba(45,78,108,.48),transparent 45%),radial-gradient(circle at 82% 78%,rgba(88,58,118,.35),transparent 45%),linear-gradient(135deg,#181d24,#14171d);border:1px solid rgba(255,255,255,.08);min-height:68vh}.nt-center{display:flex;flex-direction:column;align-items:center;gap:20px;margin:auto 0;width:100%}.nt-brand{display:flex;align-items:center;gap:14px}#ntlogo{font-size:clamp(34px,4.5vw,52px);font-weight:700;color:#f3f4f6}#ntsaber{display:none;align-items:center;width:min(420px,78%);margin-top:-8px}#ntsaber .hilt{width:46px;height:12px;background:linear-gradient(180deg,#9ca3af,#374151,#6b7280);border-radius:3px 0 0 3px}#ntsaber .blade{flex:1;height:10px;background:#fff;border-radius:0 8px 8px 0;box-shadow:0 0 12px #22c55e,0 0 28px #22c55e,0 0 42px #16a34a}.nt-search{display:flex;align-items:center;gap:12px;width:min(540px,88%);background:rgba(42,47,55,.85);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:12px 20px}.nt-search input{flex:1;background:0;border:0;outline:0;color:#f3f4f6;font-size:15px}.nt-dock{display:flex;align-items:center;justify-content:space-between;width:min(760px,96%);background:rgba(36,41,49,.82);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:12px 20px;gap:16px;flex-wrap:wrap}.nt-bm-row{display:flex;gap:14px;flex-wrap:wrap}.nt-bm{background:0;color:#e5e7eb;font-size:12px}#ntpage.mode-starwars #ntsaber{display:flex}#ntpage.mode-venom #ntlogo{color:#fff;text-shadow:0 0 20px #fff;text-transform:uppercase;font-weight:900}#ntpage.mode-doe{background:rgba(0,14,0,.94);border-color:#00ff41;font-family:monospace}#ntpage.mode-doe #ntlogo{color:#00ff41;text-shadow:0 0 14px #00ff41}#ntpage.mode-yoda #ntlogo{color:#bef264;text-shadow:0 0 16px #84cc16}
